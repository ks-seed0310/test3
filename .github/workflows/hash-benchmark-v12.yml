
name: SHA Algorithm Benchmark v1.2

on:
  workflow_dispatch:
  push:
    paths:
      - "hashalgo_v1.2.js"
      - ".github/workflows/hash-benchmark-v12.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CryptoJS
        run: npm install crypto-js@4.2.0

      - name: Export ShaAlgo
        run: echo 'module.exports = { ShaAlgo };' >> hashalgo_v1.2.js

      - name: Run benchmark
        run: |
          cat > benchmark.cjs <<'EOF'
          const { ShaAlgo } = require("./hashalgo_v1.2.js");
          const CryptoJS = require("crypto-js");
          const { performance } = require("node:perf_hooks");

          const own = new ShaAlgo();

          const algorithms = [
            ["SHA-1", "sha1_160", CryptoJS.SHA1],
            ["SHA-256", "sha2_256", CryptoJS.SHA256],
            ["SHA-384", "sha2_384", CryptoJS.SHA384],
            ["SHA-512", "sha2_512", CryptoJS.SHA512],
          ];

          const tests = [
            [64, 10000],
            [1024, 3000],
            [16 * 1024, 200],
            [128 * 1024, 30],
            [1024 * 1024, 5],
            [4 * 1024 * 1024, 2],
          ];

          const REPEATS = 5;

          function makeData(size) {
            const data = new Uint8Array(size);
            let x = 0x12345678;

            for (let i = 0; i < size; i++) {
              x ^= x << 13;
              x ^= x >>> 17;
              x ^= x << 5;
              data[i] = x & 255;
            }

            return data;
          }

          function toWordArray(bytes) {
            const words = [];

            for (let i = 0; i < bytes.length; i++) {
              words[i >>> 2] |=
                bytes[i] << (24 - (i % 4) * 8);
            }

            return CryptoJS.lib.WordArray.create(
              words,
              bytes.length
            );
          }

          function toHex(buffer) {
            return Array.from(new Uint8Array(buffer))
              .map(v => v.toString(16).padStart(2, "0"))
              .join("");
          }

          function median(values) {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
          }

          function measure(fn, iterations) {
            const start = performance.now();

            for (let i = 0; i < iterations; i++) {
              fn();
            }

            return performance.now() - start;
          }

          console.log("Node:", process.version);
          console.log("Platform:", process.platform, process.arch);
          console.log("CryptoJS:", require("crypto-js/package.json").version);
          console.log("Repeats:", REPEATS);
          console.log("");

          let total = 0;
          let passed = 0;

          for (const [size, iterations] of tests) {
            const data = makeData(size);
            const wordArray = toWordArray(data);

            console.log(`===== ${size} bytes =====`);

            for (const [name, method, cryptoFn] of algorithms) {
              const ownFn = () => own[method](data);
              const cryptoFnCall = () => cryptoFn(wordArray);

              // Correctness test
              const ownHash = toHex(ownFn());
              const cryptoHash = cryptoFnCall().toString(CryptoJS.enc.Hex);

              total++;

              if (ownHash !== cryptoHash) {
                console.log(`${name}: FAIL`);
                console.log("Own:     ", ownHash);
                console.log("CryptoJS:", cryptoHash);
                continue;
              }

              passed++;

              // Warm-up
              ownFn();
              ownFn();
              cryptoFnCall();
              cryptoFnCall();

              const ownTimes = [];
              const cryptoTimes = [];

              for (let r = 0; r < REPEATS; r++) {
                // Alternate measurement order
                if (r % 2 === 0) {
                  ownTimes.push(measure(ownFn, iterations));
                  cryptoTimes.push(measure(cryptoFnCall, iterations));
                } else {
                  cryptoTimes.push(measure(cryptoFnCall, iterations));
                  ownTimes.push(measure(ownFn, iterations));
                }
              }

              const ownMs = median(ownTimes);
              const cryptoMs = median(cryptoTimes);

              // > 1 means own implementation is faster
              const speedup = cryptoMs / ownMs;

              console.log(
                `${name}: PASS | ` +
                `Own ${ownMs.toFixed(3)} ms | ` +
                `CryptoJS ${cryptoMs.toFixed(3)} ms | ` +
                `Speedup ${speedup.toFixed(3)}x`
              );
            }

            console.log("");
          }

          console.log("===== Correctness =====");
          console.log(`Passed: ${passed}/${total}`);
          console.log(`Failed: ${total - passed}`);
          EOF

          node benchmark.cjs
