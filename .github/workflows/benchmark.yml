name: CryptoJS vs 自作ShaAlgo ベンチマーク対決

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHubの画面から手動でいつでも実行可能

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 対戦相手（CryptoJS）のインストール
        run: npm install --no-save crypto-js

      - name: hashalgo_v1.js の読み込み準備とベンチマーク実行
        run: |
          node -e '
            const fs = require("fs");
            const vm = require("vm");
            const CryptoJS = require("crypto-js");

            // 1. ./hashalgo_v1.js を読み込んでクラスを取得 (exportが無くても動くようにVMで評価)
            let code = fs.readFileSync("./hashalgo_v1.js", "utf8");
            code += "\n;globalThis.ShaAlgo = ShaAlgo;";
            vm.runInThisContext(code);

            const myAlgo = new ShaAlgo();

            // 2. テストデータの準備 (5MBのランダムバイナリ)
            const SIZE_MB = 5;
            const data = new Uint8Array(SIZE_MB * 1024 * 1024);
            for (let i = 0; i < data.length; i++) data[i] = (i * 31) & 0xff;

            // CryptoJS用のWordArray変換（公平を期すため変換時間は計測外にする）
            const wordArray = CryptoJS.lib.WordArray.create(data);

            // 3. JITコンパイラへのウォームアップ (ここで最高速の機械語へ最適化させる)
            const warmup = new Uint8Array(1024);
            for (let i = 0; i < 100; i++) {
              myAlgo.sha1_160(warmup);
              myAlgo.sha2_256(warmup);
              myAlgo.sha2_384(warmup);
              myAlgo.sha2_512(warmup);
              CryptoJS.SHA1(CryptoJS.lib.WordArray.create(warmup));
              CryptoJS.SHA256(CryptoJS.lib.WordArray.create(warmup));
              CryptoJS.SHA384(CryptoJS.lib.WordArray.create(warmup));
              CryptoJS.SHA512(CryptoJS.lib.WordArray.create(warmup));
            }

            // 4. ベンチマーク計測関数 (5回実行して平均値を算出)
            const ITERATIONS = 5;
            function bench(name, fn) {
              // 念のためGCを促す間隔を空けつつ計測
              const times = [];
              for (let i = 0; i < ITERATIONS; i++) {
                const start = performance.now();
                fn();
                const end = performance.now();
                times.push(end - start);
              }
              const avg = times.reduce((a, b) => a + b, 0) / ITERATIONS;
              return avg;
            }

            console.log(`====================================================`);
            console.log(`🔥 ベンチマーク対決 (${SIZE_MB}MB データ × ${ITERATIONS}回平均) 🔥`);
            console.log(`====================================================\n`);

            const tests = [
              {
                name: "SHA-1",
                mine: () => myAlgo.sha1_160(data),
                cjs:  () => CryptoJS.SHA1(wordArray)
              },
              {
                name: "SHA-256",
                mine: () => myAlgo.sha2_256(data),
                cjs:  () => CryptoJS.SHA256(wordArray)
              },
              {
                name: "SHA-384 (擬似64bit)",
                mine: () => myAlgo.sha2_384(data),
                cjs:  () => CryptoJS.SHA384(wordArray)
              },
              {
                name: "SHA-512 (擬似64bit)",
                mine: () => myAlgo.sha2_512(data),
                cjs:  () => CryptoJS.SHA512(wordArray)
              }
            ];

            for (const t of tests) {
              const myTime = bench(t.name, t.mine);
              const cjsTime = bench(t.name, t.cjs);
              const ratio = (cjsTime / myTime).toFixed(2);
              const winner = myTime < cjsTime ? "🏆 自作ShaAlgoの勝利！" : "💀 CryptoJSの勝利";

              console.log(`【${t.name}】`);
              console.log(`  自作 ShaAlgo : ${myTime.toFixed(2)} ms`);
              console.log(`  CryptoJS     : ${cjsTime.toFixed(2)} ms`);
              console.log(`  結果         : ${winner} (${ratio}倍速)\n`);
            }
          '
